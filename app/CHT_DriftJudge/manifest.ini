[ABOUT]
NAME = CHT Drift Judge
AUTHOR = CornerHuntersTeam
VERSION = 0.4.1
DESCRIPTION = Drift bírói rendszer: solo (kvalifikációs) pontozás zónákkal, pályaszerkesztő, telemetria-rögzítés; verseny: kvali-táblázat, Top 32 tábla, tandem csaták bírói szavazással, közvetítői HUD.

[CORE]
